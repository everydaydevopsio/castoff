name: 'AI Release Notes Generator'
description: 'Generate GitHub release notes using OpenAI ChatGPT models'
author: 'everydaydevopsio'
branding:
  icon: 'book-open'
  color: 'blue'

inputs:
  openai_api_key:
    description: 'OpenAI API key'
    required: true
  model:
    description: 'OpenAI model (model input, then OPENAI_MODEL environment variable, then gpt-6-astra)'
    required: false
  tag:
    description: 'Release tag (e.g. v1.2.3)'
    required: true
  max_commits:
    description: 'Max commits to analyze'
    required: false
    default: '200'

outputs:
  release_notes:
    description: 'AI-generated release notes in Markdown'

runs:
  using: 'node24'
  main: 'dist/index.js'
