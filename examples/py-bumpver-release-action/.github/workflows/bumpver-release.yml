name: Bump version & create release (reusable)

on:
  workflow_call:
    inputs:
      level:
        description: 'Version bump: patch, minor, major'
        required: true
        type: string
        default: patch
      use_ai_release_notes:
        description: 'Use AI to generate release notes'
        required: false
        type: boolean
        default: false
      update_changelog:
        description: 'Insert the generated notes into CHANGELOG.md (requires AI notes)'
        required: false
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: false

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bumpver
        run: pip install --upgrade pip bumpver

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Bump Version
        id: bump
        run: |
          case "${{ inputs.level }}" in
            patch) FLAG="--patch" ;;
            minor) FLAG="--minor" ;;
            major) FLAG="--major" ;;
            *) echo "Invalid level"; exit 1 ;;
          esac

          bumpver update $FLAG --commit --tag
          echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Push changes
        run: |
          git push origin HEAD
          git push origin --tags

      - name: Generate AI release notes
        id: ai_notes
        if: inputs.use_ai_release_notes == true
        uses: everydaydevopsio/castoff/castoff@v2
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          tag: ${{ steps.bump.outputs.tag }}

      - name: Create GitHub Release (AI notes)
        if: inputs.use_ai_release_notes == true && steps.ai_notes.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          body: ${{ steps.ai_notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (fallback)
        if: inputs.use_ai_release_notes != true || steps.ai_notes.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release tag is already pushed, so the entry lands as a follow-up
      # commit rather than being amended into the tagged commit.
      - name: Checkout Castoff changelog helper
        if: inputs.update_changelog == true && steps.ai_notes.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: everydaydevopsio/castoff
          ref: v2
          path: .castoff

      - name: Update CHANGELOG.md
        if: inputs.update_changelog == true && steps.ai_notes.outcome == 'success'
        env:
          CHANGELOG_ENTRY: ${{ steps.ai_notes.outputs.changelog_entry }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          printf '%s\n' "$CHANGELOG_ENTRY" |
            bash .castoff/scripts/update-changelog.sh "${TAG#v}"
          git add CHANGELOG.md
          if git diff --quiet --cached; then
            echo "CHANGELOG.md already documents $TAG; nothing to commit."
            exit 0
          fi
          git commit -m "docs: update changelog for $TAG"
          git push origin HEAD
