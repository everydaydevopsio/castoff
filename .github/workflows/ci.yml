name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from the root package.json packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the runtime the actions declare in action.yml, so tests
          # exercise the version consumers get.
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build action bundles
        run: pnpm build

      - name: Verify committed action bundles
        run: git diff --exit-code -- castoff/dist/ changelog/dist/

      - name: Run tests with coverage
        run: pnpm test:coverage

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned and checksum-verified, like the ACT installer, so no third-party
      # action runs here. Covers examples/ too, which actionlint would not find.
      - name: Lint workflow definitions
        run: bash scripts/lint-workflows.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from the root package.json packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Formatting is checked for the whole repository, not just the action.
      - name: Prettier check
        run: pnpm prettier
