name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Let in-flight releases complete — never cancel a publish mid-flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump, Build, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/require-openai-key.sh

      # Version comes from the root package.json packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Bump version
        id: bump
        run: |
          # One tag covers both actions, so their versions move together.
          npm version ${{ inputs.level }} --no-git-tag-version --prefix castoff
          VERSION=$(node -p "require('./castoff/package.json').version")
          npm version "${VERSION}" --no-git-tag-version --allow-same-version --prefix changelog
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          MAJOR=$(echo "${VERSION}" | cut -d. -f1)
          MINOR=$(echo "${VERSION}" | cut -d. -f2)
          echo "major_tag=v${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor_tag=v${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Build dist
        run: pnpm build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit release artifacts
        run: |
          git add castoff/package.json changelog/package.json
          git add castoff/dist/ changelog/dist/
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"

      - name: Generate AI release notes
        id: release_notes
        uses: ./castoff
        env:
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          tag: ${{ steps.bump.outputs.tag }}

      - name: Update CHANGELOG.md
        id: changelog
        uses: ./changelog
        with:
          version: ${{ steps.bump.outputs.version }}
          entry: ${{ steps.release_notes.outputs.changelog_entry }}

      - name: Fold the changelog into the release commit
        if: steps.changelog.outputs.updated == 'true'
        run: |
          git add CHANGELOG.md
          # Amend so the tag created below carries its own changelog.
          git commit --amend --no-edit

      - name: Tag and push
        run: |
          git tag "${{ steps.bump.outputs.tag }}"
          # Floating tags follow the newest release in their series, so
          # `@v2` and `@v2.2` both resolve to this patch. They are recreated
          # rather than moved when the series is new, which -f covers too.
          git tag -f "${{ steps.bump.outputs.major_tag }}"
          git tag -f "${{ steps.bump.outputs.minor_tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"
          git push origin --force \
            "${{ steps.bump.outputs.major_tag }}" \
            "${{ steps.bump.outputs.minor_tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          body: ${{ steps.release_notes.outputs.release_notes }}
          generate_release_notes: false
