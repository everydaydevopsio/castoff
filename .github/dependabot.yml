version: 2
updates:
  # One lockfile lives at the workspace root, so Dependabot must run there:
  # updating a package manifest without pnpm-lock.yaml fails CI's
  # `pnpm install --frozen-lockfile`. From the root it also covers the root
  # dev tooling, castoff/ and changelog/.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # TypeScript majors are language upgrades, not dependency bumps; stay on 6.x.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Node typings track the runtime: .nvmrc and the actions' node24. A major
      # bump would type against APIs the published actions cannot call.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      testing:
        patterns:
          - 'jest'
          - '@jest/*'
          # Listed here rather than with typescript: the transform tracks the
          # runner, so a jest major has to carry ts-jest with it.
          - 'ts-jest'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
      dev-tooling:
        dependency-type: 'development'
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'globals'
          - 'husky'
          - 'lint-staged'
          - '@vercel/ncc'
      # The catch-all. `dependency-type` already keeps the dev-only groups
      # above out of it; the exclusions make that independent of how a
      # dependency happens to be declared.
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
        exclude-patterns:
          - 'jest'
          - '@jest/*'
          - 'ts-jest'
          - 'typescript'
          - '@types/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'globals'
          - 'husky'
          - 'lint-staged'
          - '@vercel/ncc'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
